<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobFit porovná tvoje CV s pracovným inzerátom a sleduje stav žiadostí. Beží celé v prehliadači." />
    <meta name="theme-color" content="#2f5d50" />
    <title>JobFit – asistent na hľadanie práce</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash (same logic as src/lib/theme.ts).
      try {
        var theme = localStorage.getItem('jobfit.theme') || 'system'
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
